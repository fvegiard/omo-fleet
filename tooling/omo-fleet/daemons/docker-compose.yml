name: omo-daemons-20261022
services:
  omo-01:
    build: .
    image: omo-fleet-opencode:1.19.4
    restart: unless-stopped
    init: true
    ports: ['127.0.0.1:4401:4096']
    environment:
      FLEET_ID: omo-01
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Run setup.mjs first}
    volumes:
      - ./config:/run/fleet-config:ro
      - omo-01-state:/state
      - type: bind
        source: ${USERPROFILE}/.codex/auth.json
        target: /run/credentials/codex.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: D:/Github/dr-knowledge-lab/evidence/antigravity-routing-20261022.md
        target: /workspace/antigravity-routing.md
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${APPDATA}/Code/User/settings.json
        target: /workspace/vscode-settings.json
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4096/global/health',{headers:{Authorization:'Basic '+Buffer.from('opencode:'+process.env.OPENCODE_SERVER_PASSWORD).toString('base64')}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
